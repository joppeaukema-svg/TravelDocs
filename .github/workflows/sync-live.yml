name: Sync live data

# Daily: Dutch travel advice, embassies and exchange rates → public/live/.
# Commits only when something changed; the push to main redeploys the site.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the deploy (pushes made with GITHUB_TOKEN don't trigger workflows)

concurrency:
  group: sync-live
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync-live
      - name: Commit if the data changed
        id: commit
        run: |
          # fetchedAt changes on every run; only commit real changes.
          if git diff --quiet -I '"fetchedAt"' -- public/live && [ -z "$(git ls-files --others --exclude-standard public/live)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/live
          git commit -m "Update live data (travel advice, embassies, rates)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
