# Cloudflare Worker that sends Travel Companion push notifications.
# Set up and deployed by .github/workflows/push-setup.yml (see README → Push notifications),
# which fills in ALLOWED_ORIGIN, VAPID_SUBJECT and the storage id.
name = "travel-companion-push"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
# The site that hosts the app (no path, no trailing slash).
ALLOWED_ORIGIN = "https://joppeaukema-svg.github.io"
VAPID_SUBJECT = "https://joppeaukema-svg.github.io/TravelDocs/"
# The VAPID key pair is made by the worker on first use and kept in SUBS.

[[kv_namespaces]]
binding = "SUBS"
id = "REPLACED_BY_THE_SETUP_WORKFLOW"
