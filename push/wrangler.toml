# Cloudflare Worker that sends Travel Companion push notifications.
# Setup: see "Push notifications" in the README.
name = "travel-companion-push"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# The site that hosts the app (no path, no trailing slash).
ALLOWED_ORIGIN = "https://joppeaukema-svg.github.io"
VAPID_SUBJECT = "https://joppeaukema-svg.github.io/TravelDocs/"
# VAPID_PUBLIC_KEY is set here too; VAPID_PRIVATE_KEY only as a secret:
#   npx wrangler secret put VAPID_PRIVATE_KEY
VAPID_PUBLIC_KEY = ""

[[kv_namespaces]]
binding = "SUBS"
# Fill in after: npx wrangler kv namespace create SUBS
id = ""
